name: Apply focused React expansion

on:
  push:
    branches:
      - react-focused-bootstrap-20260801
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Expand, validate, and publish focused React lessons
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: react-focused-bootstrap-20260801
          fetch-depth: 0

      - name: Reconstruct and verify curriculum payload
        shell: bash
        run: |
          cat .react-focused-payload/part-*.b64 > /tmp/react-focused.b64
          base64 --decode /tmp/react-focused.b64 > /tmp/react-focused.tar.xz
          echo "e1c1469fbe8b17b666c09b77e5ad429e2831d3959f457fc06252026148c33878  /tmp/react-focused.tar.xz" | sha256sum --check

      - name: Create clean output branch from main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B react-focused-foundations-20260801 origin/main
          tar -xJf /tmp/react-focused.tar.xz -C .

      - name: Validate focused lesson contract
        run: node scripts/validate-react-focused.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Validate every Mermaid diagram
        run: npm run validate:mermaid

      - name: Build production Docusaurus site
        run: npm run build

      - name: Publish validated output branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(react): add focused foundations curriculum"
          git push --force origin HEAD:react-focused-foundations-20260801
