name: Clean JavaScript compatibility route

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'javascript-complete-handbook-2026-08-02' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove redundant redirect and validate landing route
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const configPath = 'docusaurus.config.js'
          let config = fs.readFileSync(configPath, 'utf8')
          config = config.replace(
            "          {\n            to: '/docs/javascript/intro',\n            from: '/javascript',\n          },\n",
            '',
          )
          fs.writeFileSync(configPath, config)

          const validatorPath = 'scripts/validate-javascript-handbook.mjs'
          let validator = fs.readFileSync(validatorPath, 'utf8')
          const oldBlock = `let compatibilityRedirects = 0
if (!fs.existsSync(configPath)) {
  fail('docusaurus.config.js does not exist')
} else {
  const config = fs.readFileSync(configPath, 'utf8')
  if (!config.includes("{to: '/docs/javascript/intro', label: 'JavaScript'")) {
    fail('Navbar does not use the canonical JavaScript entry')
  }
  if (!config.includes("{label: 'JavaScript', to: '/docs/javascript/intro'")) {
    fail('Footer does not use the canonical JavaScript entry')
  }
  if (config.includes("from: '/javascript'") && config.includes("to: '/docs/javascript/intro'")) {
    compatibilityRedirects += 1
  } else {
    fail('Legacy /javascript route does not redirect to the canonical JavaScript introduction')
  }
}`
          const newBlock = `const compatibilityRedirects = 0
let compatibilityRoutes = 0
if (!fs.existsSync(configPath)) {
  fail('docusaurus.config.js does not exist')
} else {
  const config = fs.readFileSync(configPath, 'utf8')
  if (!config.includes("{to: '/docs/javascript/intro', label: 'JavaScript'")) {
    fail('Navbar does not use the canonical JavaScript entry')
  }
  if (!config.includes("{label: 'JavaScript', to: '/docs/javascript/intro'")) {
    fail('Footer does not use the canonical JavaScript entry')
  }
  const legacyLanding = path.join(root, 'src', 'pages', 'javascript.jsx')
  if (fs.existsSync(legacyLanding)) {
    compatibilityRoutes += 1
  } else {
    fail('Legacy /javascript landing route is not preserved')
  }
}`
          if (!validator.includes(oldBlock)) throw new Error('Unable to locate compatibility validation block')
          validator = validator.replace(oldBlock, newBlock)
          validator = validator.replace(
            '  compatibilityRedirects,\n  explicitSlugs:',
            '  compatibilityRedirects,\n  compatibilityRoutes,\n  explicitSlugs:',
          )
          fs.writeFileSync(validatorPath, validator)
          NODE

      - name: Commit compatibility cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docusaurus.config.js scripts/validate-javascript-handbook.mjs
          git commit -m "fix(js): preserve legacy landing without redundant redirect"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
