name: Generate complete React Native handbook

on:
  push:
    branches:
      - react-native-complete-handbook-2026-08-02
    paths:
      - '.github/react-native-generator/**'
      - '.github/workflows/react-native-generate.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/react-native-generator/**'
      - '.github/workflows/react-native-generate.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Reconstruct and verify generator
        run: |
          python - <<'PY'
          from pathlib import Path
          clean = lambda name: ''.join(Path(name).read_text().split())
          first = clean('.github/react-native-generator/chunk1.b64')
          bridge = clean('.github/react-native-generator/bridge.b64')
          third = clean('.github/react-native-generator/chunk3.b64')
          fourth = clean('.github/react-native-generator/chunk4.b64')
          fifth = clean('.github/react-native-generator/chunk5.b64')
          assert len(first) == 10000
          assert len(bridge) == 4000
          assert len(third) == 7000
          assert len(fourth) == 7000
          assert len(fifth) == 6696
          combined = first + bridge + third + fourth + fifth
          Path('/tmp/generator.b64').write_text(combined)
          print(f'combined: {len(combined)} characters')
          PY
          echo 'dadf171424133312221df3f87949acbe8b598ed2c691c0997694c5ce78fd6d1b  /tmp/generator.b64' | sha256sum --check
          base64 --decode /tmp/generator.b64 \
            | gzip --decompress \
            > /tmp/generate-react-native-completion.mjs
          node --check /tmp/generate-react-native-completion.mjs

      - name: Generate focused handbook content
        run: node /tmp/generate-react-native-completion.mjs

      - name: Correct generated validator and metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          validator = Path('scripts/validate-react-native-handbook.mjs')
          source = validator.read_text()
          old = """    if (!fs.existsSync(path.join(docsRoot, relative + '.md')) && !fs.existsSync(path.join(docsRoot, relative + '.mdx'))) fail(`Sidebar references missing document: ${relative}`)"""
          new = """    if (!ids.has(relative)) fail(`Sidebar references missing document: ${relative}`)"""
          if old not in source:
              raise SystemExit('Expected sidebar validation statement was not found')
          validator.write_text(source.replace(old, new))

          overview = Path('docs/react-native/exercises/overview.mdx')
          source = overview.read_text()
          old = 'description: Exactly 300 Community CLI exercises: 100 beginner, 100 intermediate and 100 advanced.'
          new = 'description: "Exactly 300 Community CLI exercises: 100 beginner, 100 intermediate and 100 advanced."'
          if old not in source:
              raise SystemExit('Expected exercise description was not found')
          overview.write_text(source.replace(old, new))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Validate React Native handbook
        run: npm run validate:react-native

      - name: Validate TypeScript regression
        run: npm run validate:typescript

      - name: Validate JavaScript regression
        run: npm run validate:javascript

      - name: Validate Node.js regression
        run: npm run validate:nodejs

      - name: Validate Next.js regression
        run: npm run validate:nextjs

      - name: Validate Mermaid diagrams
        run: npm run validate:mermaid

      - name: Build Docusaurus production site
        run: npm run build

      - name: Commit validated handbook content
        run: |
          rm -rf .github/react-native-generator
          git checkout HEAD -- .github/workflows/deploy.yml .github/workflows/react-native-generate.yml
          rm -f .github/workflows/react-native-handbook.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(react-native): add complete focused handbook'
          git push origin "HEAD:${TARGET_BRANCH}"
