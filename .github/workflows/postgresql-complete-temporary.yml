name: Generate and validate complete PostgreSQL handbook

on:
  push:
    branches:
      - postgresql-complete-handbook-2026-08-03
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: postgresql-complete-handbook-generator
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and validate PostgreSQL handbook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: postgresql-complete-handbook-2026-08-03
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Upload generator parts for exact inspection
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-generator-parts-debug
          path: scripts/postgresql-generator-parts
          if-no-files-found: error
          retention-days: 1

      - name: Verify generator payload checksums
        run: |
          cd scripts/postgresql-generator-parts
          sha256sum part-001.txt part-002.txt part-003.txt part-004.txt
          printf '%s  %s\n' \
            5635d995a864fc0e9b7dfdcef7c27e8a0546dd3e47014505d46dfe00df102569 part-001.txt \
            0cf02db221b8182fbb6cee943aeb573cccd326db066256f7123fa659c002e862 part-002.txt \
            9c75605a75b9d0a938585540f4fdcce1e79072e0f28619c770a05a93407990ac part-003.txt \
            6f787a162f910fb7469cc42eb2ef60befda2eae836f4e30a507deff988cadba9 part-004.txt \
            | sha256sum -c -
          cat part-001.txt part-002.txt part-003.txt part-004.txt | sha256sum

      - name: Generate handbook
        run: node scripts/generate-postgresql-handbook-temporary.mjs

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Validate PostgreSQL handbook
        run: npm run validate:postgresql

      - name: Validate TypeScript handbook regression
        run: npm run validate:typescript

      - name: Validate JavaScript handbook regression
        run: npm run validate:javascript

      - name: Validate Node.js handbook regression
        run: npm run validate:nodejs

      - name: Validate Next.js handbook regression
        run: npm run validate:nextjs

      - name: Validate React Native handbook regression
        run: npm run validate:react-native

      - name: Validate Mermaid diagrams
        run: npm run validate:mermaid

      - name: Build Docusaurus production site
        run: npm run build

      - name: Commit generated handbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "docs(postgresql): complete production handbook"
            git push origin HEAD:postgresql-complete-handbook-2026-08-03
          fi
