name: Verify Next.js Pages release

on:
  pull_request:
    paths:
      - '.github/workflows/verify-nextjs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Discover deployed Next.js routes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: e0d50e81d2aa77dbb312368bd49e81b8776ee28d
      SITE_BASE: https://salman0butt.github.io/handbook

    steps:
      - name: Confirm permanent Pages workflow
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          target_sha = os.environ['TARGET_SHA']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repository}/actions/runs?head_sha={target_sha}&event=push&per_page=100'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'nextjs-pages-verifier',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          selected = None
          for attempt in range(40):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              candidates = [
                  run for run in payload.get('workflow_runs', [])
                  if run.get('name') == 'Deploy handbook to GitHub Pages'
                  or str(run.get('path', '')).startswith('.github/workflows/deploy.yml')
              ]
              if candidates:
                  selected = max(candidates, key=lambda run: run.get('run_number', 0))
                  print(f"Pages run {selected['id']}: status={selected['status']} conclusion={selected.get('conclusion')}")
                  if selected['status'] == 'completed':
                      break
              else:
                  print(f'No Pages run found for {target_sha} yet (attempt {attempt + 1}/40)')
              time.sleep(15)

          if not selected or selected['status'] != 'completed' or selected.get('conclusion') != 'success':
              print('The permanent Pages workflow was not successful for the target commit.', file=sys.stderr)
              sys.exit(1)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"run_id={selected['id']}\n")
              handle.write(f"run_url={selected['html_url']}\n")
              handle.write(f"run_number={selected['run_number']}\n")
              handle.write(f"conclusion={selected['conclusion']}\n")
          PY

      - name: Discover Next.js routes from sitemap
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          sitemap = f"{os.environ['SITE_BASE']}/sitemap.xml"
          with urllib.request.urlopen(sitemap, timeout=60) as response:
              root = ET.fromstring(response.read())
          namespace = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          routes = sorted(
              node.text for node in root.findall('.//sm:loc', namespace)
              if node.text and '/nextjs/' in node.text
          )
          print(f'NEXTJS_SITEMAP_ROUTE_COUNT={len(routes)}')
          for route in routes:
              print(f'NEXTJS_ROUTE {route}')
          PY

      - name: Verify known deployed completion routes
        run: |
          set -euo pipefail
          routes=(
            '/'
            '/docs/nextjs/complete-handbook'
            '/docs/nextjs/complete-handbook/version'
            '/docs/nextjs/complete-handbook/roadmap'
            '/docs/nextjs/complete-handbook/reference/completion-matrix'
            '/docs/nextjs/complete-handbook/capstones/production-api-platform'
          )
          for route in "${routes[@]}"; do
            url="${SITE_BASE}${route}"
            code="$(curl --location --silent --show-error --retry 4 --retry-delay 5 --output /tmp/route.html --write-out '%{http_code}' "$url")"
            test "$code" = '200'
            ! grep -Eqi 'Page Not Found|404[^0-9]' /tmp/route.html
            echo "PASS $code $url"
          done

      - name: Verify release-specific content
        run: |
          set -euo pipefail
          curl --location --silent --show-error --fail --retry 4 \
            "${SITE_BASE}/docs/nextjs/complete-handbook" | grep -F 'Complete Next.js Handbook Coverage'
          curl --location --silent --show-error --fail --retry 4 \
            "${SITE_BASE}/docs/nextjs/complete-handbook/version" | grep -F '16.2.11'
          curl --location --silent --show-error --fail --retry 4 \
            "${SITE_BASE}/docs/nextjs/complete-handbook/capstones/production-api-platform" | grep -F 'Production API Platform'

      - name: Report verified deployment
        run: |
          echo "Pages workflow run ID: ${{ steps.pages.outputs.run_id }}"
          echo "Pages workflow run number: ${{ steps.pages.outputs.run_number }}"
          echo "Pages conclusion: ${{ steps.pages.outputs.conclusion }}"
          echo "Pages workflow URL: ${{ steps.pages.outputs.run_url }}"
