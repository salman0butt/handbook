name: Verify Next.js Pages release

on:
  pull_request:
    paths:
      - '.github/workflows/verify-nextjs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify deployed handbook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: e0d50e81d2aa77dbb312368bd49e81b8776ee28d
      SITE_BASE: https://salman0butt.github.io/handbook

    steps:
      - name: Wait for permanent Pages workflow
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          target_sha = os.environ['TARGET_SHA']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repository}/actions/runs?head_sha={target_sha}&event=push&per_page=100'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'nextjs-pages-verifier',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          selected = None
          for attempt in range(40):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)

              runs = payload.get('workflow_runs', [])
              candidates = [
                  run for run in runs
                  if run.get('name') == 'Deploy handbook to GitHub Pages'
                  or str(run.get('path', '')).startswith('.github/workflows/deploy.yml')
              ]
              if candidates:
                  selected = max(candidates, key=lambda run: run.get('run_number', 0))
                  print(
                      f"Pages run {selected['id']}: "
                      f"status={selected['status']} conclusion={selected.get('conclusion')}"
                  )
                  if selected['status'] == 'completed':
                      break
              else:
                  print(f'No Pages run found for {target_sha} yet (attempt {attempt + 1}/40)')
              time.sleep(15)

          if not selected:
              print('No permanent Pages workflow run was found for the merged commit.', file=sys.stderr)
              sys.exit(1)
          if selected['status'] != 'completed':
              print('Pages workflow did not complete before the verification timeout.', file=sys.stderr)
              sys.exit(1)
          if selected.get('conclusion') != 'success':
              print(f"Pages workflow conclusion was {selected.get('conclusion')!r}.", file=sys.stderr)
              sys.exit(1)

          output = os.environ['GITHUB_OUTPUT']
          with open(output, 'a', encoding='utf-8') as handle:
              handle.write(f"run_id={selected['id']}\n")
              handle.write(f"run_url={selected['html_url']}\n")
              handle.write(f"run_number={selected['run_number']}\n")
              handle.write(f"conclusion={selected['conclusion']}\n")
          PY

      - name: Verify representative public routes
        run: |
          set -euo pipefail
          routes=(
            '/'
            '/nextjs/intro'
            '/nextjs/version'
            '/nextjs/roadmap'
            '/nextjs/complete-handbook'
            '/docs/nextjs/app-router/app-directory'
            '/docs/nextjs/routing/dynamic-routes'
            '/docs/nextjs/server-components/server-components'
            '/docs/nextjs/caching/cache-layers'
            '/docs/nextjs/rendering/static-rendering'
            '/docs/nextjs/server-functions/server-actions'
            '/docs/nextjs/route-handlers/route-handlers'
            '/docs/nextjs/authentication/authentication-overview'
            '/docs/nextjs/deployment/deployment-overview'
            '/docs/nextjs/complete-handbook/version'
            '/docs/nextjs/complete-handbook/reference/completion-matrix'
            '/docs/nextjs/complete-handbook/capstones/production-api-platform'
          )

          failed=0
          for route in "${routes[@]}"; do
            url="${SITE_BASE}${route}"
            output="$(mktemp)"
            code="$(curl --location --silent --show-error --retry 4 --retry-delay 5 --output "$output" --write-out '%{http_code}' "$url")"
            if [[ "$code" != '200' ]] || grep -Eqi 'Page Not Found|404[^0-9]' "$output"; then
              echo "FAIL $code $url"
              failed=1
            else
              title="$(grep -oPm1 '(?<=<title>)[^<]+' "$output" || true)"
              echo "PASS $code $url ${title:+— $title}"
            fi
            rm -f "$output"
          done
          exit "$failed"

      - name: Verify release-specific content
        run: |
          set -euo pipefail
          curl --location --silent --show-error --fail --retry 4 \
            "${SITE_BASE}/nextjs/complete-handbook" | grep -F 'Complete Next.js Handbook Coverage'
          curl --location --silent --show-error --fail --retry 4 \
            "${SITE_BASE}/docs/nextjs/complete-handbook/version" | grep -F '16.2.11'
          curl --location --silent --show-error --fail --retry 4 \
            "${SITE_BASE}/docs/nextjs/complete-handbook/capstones/production-api-platform" | grep -F 'Production API Platform'

      - name: Report verified deployment
        run: |
          echo "Pages workflow run ID: ${{ steps.pages.outputs.run_id }}"
          echo "Pages workflow run number: ${{ steps.pages.outputs.run_number }}"
          echo "Pages conclusion: ${{ steps.pages.outputs.conclusion }}"
          echo "Pages workflow URL: ${{ steps.pages.outputs.run_url }}"
