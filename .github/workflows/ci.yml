name: Validate handbook build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verify visual AI foundations release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Build production site
        run: npm run build

      - name: Verify generated lessons, code, diagrams and search index
        shell: bash
        run: |
          set -euo pipefail

          count=$(find docs/ai-engineering/foundations docs/ai-engineering/prompt-engineering -type f -name '*.md' | wc -l)
          test "$count" -ge 44 || { echo "Expected at least 44 focused beginner/prompt lessons, got $count"; exit 1; }

          for file in \
            docs/ai-engineering/foundations/what-is-llm.md \
            docs/ai-engineering/foundations/what-is-a-token.md \
            docs/ai-engineering/foundations/tokenization.md \
            docs/ai-engineering/foundations/transformers.md \
            docs/ai-engineering/foundations/attention.md \
            docs/ai-engineering/foundations/kv-cache.md \
            docs/ai-engineering/foundations/prompt-cache.md \
            docs/ai-engineering/foundations/response-cache.md \
            docs/ai-engineering/prompt-engineering/types-of-prompting.md; do
              grep -Fq '```mermaid' "$file"
              grep -Fq '```ts' "$file"
              grep -Fq '## Practice' "$file"
          done

          grep -Fq '"@docusaurus/theme-mermaid"' package.json
          grep -Fq '"@mermaid-js/layout-elk"' package.json
          grep -Fq 'mermaid: true' docusaurus.config.js
          grep -Fq "themes: ['@docusaurus/theme-mermaid']" docusaurus.config.js

          INDEX='build/search-index-docs-default-current.json'
          test -f "$INDEX"
          for term in \
            'What Is a Token?' \
            'Tokenization' \
            'Large Language Model' \
            'KV Cache' \
            'Prompt Caching' \
            'Response Caching' \
            'Attention, Queries, Keys & Values' \
            'Zero-Shot Prompting' \
            'Few-Shot Prompting'; do
              grep -Fiq "$term" "$INDEX" || { echo "Search index missing: $term"; exit 1; }
          done

          token_html=$(find build -type f -path '*foundations/what-is-a-token*' | head -1)
          test -n "$token_html" || { echo 'Built token page not found'; exit 1; }
          grep -Fiq 'toyTokenizer' "$token_html" || { echo 'Built token page missing code example'; exit 1; }
          grep -Fiq 'Raw Text' "$token_html" || { echo 'Built token page missing diagram content'; exit 1; }

          echo "PASS focused lessons, search index, code examples, Mermaid source/configuration, and production build output"

      - name: Verify merged Pages deployment run
        shell: bash
        run: |
          set -euo pipefail
          MERGE_SHA='346fc5e99fe26be2214da28f956c63bfdb70fe74'
          API="https://api.github.com/repos/salman0butt/handbook/actions/runs?head_sha=$MERGE_SHA"

          for attempt in $(seq 1 36); do
            curl -fsSL -H 'Accept: application/vnd.github+json' "$API" -o /tmp/runs.json
            if python - <<'PY'
          import json
          with open('/tmp/runs.json', encoding='utf-8') as f:
              data = json.load(f)
          runs = [r for r in data.get('workflow_runs', []) if r.get('event') == 'push' and r.get('name') == 'Deploy handbook to GitHub Pages']
          ok = [r for r in runs if r.get('conclusion') == 'success']
          if ok:
              r = ok[0]
              print(f"PASS Pages workflow run {r['id']} {r.get('html_url', '')}")
              raise SystemExit(0)
          failed = [r for r in runs if r.get('conclusion') == 'failure']
          if failed:
              print('FAIL Pages deployment:', [(r.get('id'), r.get('status'), r.get('conclusion')) for r in runs])
              raise SystemExit(2)
          print('Pages run state:', [(r.get('id'), r.get('status'), r.get('conclusion')) for r in runs])
          raise SystemExit(1)
          PY
            then
              exit 0
            else
              status=$?
              if [ "$status" -eq 2 ]; then exit 1; fi
            fi
            sleep 5
          done

          echo 'FAIL merged Pages deployment did not reach success'
          exit 1

      - name: Verify deployed beginner handbook
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://salman0butt.github.io/handbook'

          check_page() {
            local path="$1"
            local needle="$2"
            local body=''
            for attempt in $(seq 1 20); do
              body=$(curl -fsSL --connect-timeout 10 --max-time 30 "$BASE$path" || true)
              if grep -Fq "$needle" <<< "$body"; then
                echo "PASS $path -> $needle"
                return 0
              fi
              echo "Attempt $attempt: $path not ready yet"
              sleep 5
            done
            echo "FAIL $path missing expected content: $needle"
            return 1
          }

          check_page '/docs/ai-engineering/00-start-here' 'What is a token'
          check_page '/docs/ai-engineering/foundations/what-is-ai' 'Artificial Intelligence'
          check_page '/docs/ai-engineering/foundations/what-is-llm' 'Large Language Model'
          check_page '/docs/ai-engineering/foundations/what-is-a-token' 'A token is a unit'
          check_page '/docs/ai-engineering/foundations/what-is-a-token' 'toyTokenizer'
          check_page '/docs/ai-engineering/foundations/what-is-a-token' 'Raw Text'
          check_page '/docs/ai-engineering/foundations/tokenization' 'Byte Pair Encoding'
          check_page '/docs/ai-engineering/foundations/transformers' 'Transformer Block'
          check_page '/docs/ai-engineering/foundations/attention' 'Queries, Keys'
          check_page '/docs/ai-engineering/foundations/kv-cache' 'previously processed tokens'
          check_page '/docs/ai-engineering/foundations/prompt-cache' 'stable prompt prefix'
          check_page '/docs/ai-engineering/foundations/response-cache' 'application-level cache'
          check_page '/docs/ai-engineering/prompt-engineering/types-of-prompting' 'Zero-shot prompting'
          check_page '/docs/ai-engineering/prompt-engineering/one-shot-few-shot-prompting' 'Few-shot prompting'

          echo 'PASS live beginner pages include expected lesson, code-example, and diagram content'
