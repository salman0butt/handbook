name: Validate handbook build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Verify final zero-to-hero certification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Build production site
        run: npm run build

      - name: Verify published COMPLETE audit and representative routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://salman0butt.github.io/handbook'

          check_page() {
            local path="$1"
            local needle="$2"
            local body=''
            for attempt in $(seq 1 36); do
              body=$(curl -fsSL --connect-timeout 10 --max-time 30 "$BASE$path" || true)
              if grep -Fq "$needle" <<< "$body"; then
                echo "PASS $path -> $needle"
                return 0
              fi
              echo "Attempt $attempt: $path not ready"
              sleep 5
            done
            echo "FAIL $path missing: $needle"
            return 1
          }

          check_page '/docs/ai-engineering/reference/final-completeness-audit' 'Status: COMPLETE'
          check_page '/docs/ai-engineering/reference/final-completeness-audit' '107 focused lessons'
          check_page '/docs/ai-engineering/zero-to-hero/mcp/mcp-server-discovery' 'server/discover'
          check_page '/docs/ai-engineering/zero-to-hero/inference/vllm-serving' 'vLLM Serving Architecture'
          check_page '/docs/ai-engineering/zero-to-hero/openai-agents-sdk/openai-agents-sdk-overview' 'OpenAI Agents SDK'
          check_page '/docs/ai-engineering/zero-to-hero/a2a/mcp-vs-a2a' 'MCP vs A2A'

          echo 'PASS final published zero-to-hero certification and representative routes'
