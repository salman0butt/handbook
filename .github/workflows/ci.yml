name: Validate handbook build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Verify deployed navbar and Mermaid
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser driver
        run: npm install --no-save --no-audit --no-fund --loglevel=error puppeteer-core@24.16.0

      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Verify live desktop UI
        run: node scripts/verify-live-navbar.cjs

      - name: Upload live screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navbar-mermaid-live
          path: /tmp/navbar-mermaid-live.png
          if-no-files-found: warn
