name: Validate handbook build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Verify zero-to-hero release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Build production site
        run: npm run build

      - name: Verify generated search index
        shell: bash
        run: |
          set -euo pipefail
          INDEX='build/search-index-docs-default-current.json'
          test -f "$INDEX"
          for term in \
            'Backpropagation' \
            'Chat Templates' \
            'Grouped-Query Attention' \
            'Perplexity' \
            'Context Engineering' \
            'Background Runs' \
            'Reinforcement Fine-Tuning' \
            'PagedAttention' \
            'ColBERT' \
            'OpenAI Agents SDK' \
            'server/discover' \
            'Agent2Agent' \
            'Zero Data Retention'; do
              grep -Fiq "$term" "$INDEX" || { echo "Search index missing: $term"; exit 1; }
          done
          echo 'PASS zero-to-hero search index'

      - name: Verify merged Pages deployment run
        shell: bash
        run: |
          set -euo pipefail
          MERGE_SHA='a6dd0cd2d8ef95b47544b863a0311643ccb57658'
          API="https://api.github.com/repos/salman0butt/handbook/actions/runs?head_sha=$MERGE_SHA"

          for attempt in $(seq 1 48); do
            curl -fsSL -H 'Accept: application/vnd.github+json' "$API" -o /tmp/runs.json
            if python - <<'PY'
          import json
          with open('/tmp/runs.json', encoding='utf-8') as f:
              data = json.load(f)
          runs = [r for r in data.get('workflow_runs', []) if r.get('event') == 'push' and r.get('name') == 'Deploy handbook to GitHub Pages']
          success = [r for r in runs if r.get('conclusion') == 'success']
          if success:
              r = success[0]
              print(f"PASS Pages workflow run {r['id']} {r.get('html_url', '')}")
              raise SystemExit(0)
          failed = [r for r in runs if r.get('conclusion') == 'failure']
          if failed:
              print('FAIL Pages deployment:', [(r.get('id'), r.get('status'), r.get('conclusion')) for r in runs])
              raise SystemExit(2)
          print('Pages state:', [(r.get('id'), r.get('status'), r.get('conclusion')) for r in runs])
          raise SystemExit(1)
          PY
            then
              exit 0
            else
              status=$?
              if [ "$status" -eq 2 ]; then exit 1; fi
            fi
            sleep 5
          done
          echo 'FAIL Pages deployment did not reach success'
          exit 1

      - name: Verify deployed zero-to-hero routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://salman0butt.github.io/handbook'

          check_page() {
            local path="$1"
            local needle="$2"
            local body=''
            for attempt in $(seq 1 24); do
              body=$(curl -fsSL --connect-timeout 10 --max-time 30 "$BASE$path" || true)
              if grep -Fq "$needle" <<< "$body"; then
                echo "PASS $path -> $needle"
                return 0
              fi
              echo "Attempt $attempt: $path not ready"
              sleep 5
            done
            echo "FAIL $path missing: $needle"
            return 1
          }

          check_page '/docs/ai-engineering/zero-to-hero/neural-networks/forward-pass-loss' 'Forward Pass'
          check_page '/docs/ai-engineering/zero-to-hero/tokenizers/chat-templates' 'Chat Templates'
          check_page '/docs/ai-engineering/zero-to-hero/transformers/mha-mqa-gqa' 'Grouped-Query Attention'
          check_page '/docs/ai-engineering/zero-to-hero/language-modeling/cross-entropy-perplexity' 'Perplexity'
          check_page '/docs/ai-engineering/zero-to-hero/context-engineering/context-engineering-overview' 'Context Engineering'
          check_page '/docs/ai-engineering/zero-to-hero/llm-integration/background-webhooks-batch' 'Background Runs'
          check_page '/docs/ai-engineering/zero-to-hero/multimodal-understanding/documents-ocr-layout' 'Layout-Aware Document'
          check_page '/docs/ai-engineering/zero-to-hero/training/pretraining-pipeline' 'LLM Pretraining Pipeline'
          check_page '/docs/ai-engineering/zero-to-hero/inference/pagedattention-continuous-batching' 'Continuous Batching'
          check_page '/docs/ai-engineering/zero-to-hero/advanced-rag/late-interaction-colbert' 'Late Interaction'
          check_page '/docs/ai-engineering/zero-to-hero/openai-agents-sdk/openai-agents-sdk-overview' 'OpenAI Agents SDK'
          check_page '/docs/ai-engineering/zero-to-hero/mcp/mcp-stateless-capabilities' 'Stateless Requests'
          check_page '/docs/ai-engineering/zero-to-hero/a2a/a2a-overview' 'Agent2Agent'
          check_page '/docs/ai-engineering/zero-to-hero/privacy/retention-zdr' 'Zero Data Retention'
          check_page '/docs/ai-engineering/reference/zero-to-hero-gap-closure' '107 focused lessons'

          echo 'PASS deployed zero-to-hero routes'
