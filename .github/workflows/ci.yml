name: Validate handbook build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Verify final zero-to-hero certification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Build production site
        run: npm run build

      - name: Verify certification Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          CERT_SHA='796156b971742abd1027a8f0e17259f2bfffb8b7'
          API="https://api.github.com/repos/salman0butt/handbook/actions/runs?head_sha=$CERT_SHA"

          for attempt in $(seq 1 48); do
            curl -fsSL -H 'Accept: application/vnd.github+json' "$API" -o /tmp/runs.json
            if python - <<'PY'
          import json
          with open('/tmp/runs.json', encoding='utf-8') as f:
              data = json.load(f)
          runs = [r for r in data.get('workflow_runs', []) if r.get('event') == 'push' and r.get('name') == 'Deploy handbook to GitHub Pages']
          success = [r for r in runs if r.get('conclusion') == 'success']
          if success:
              r = success[0]
              print(f"PASS certification Pages workflow run {r['id']} {r.get('html_url', '')}")
              raise SystemExit(0)
          failed = [r for r in runs if r.get('conclusion') == 'failure']
          if failed:
              print('FAIL Pages deployment:', [(r.get('id'), r.get('status'), r.get('conclusion')) for r in runs])
              raise SystemExit(2)
          print('Pages state:', [(r.get('id'), r.get('status'), r.get('conclusion')) for r in runs])
          raise SystemExit(1)
          PY
            then
              exit 0
            else
              status=$?
              if [ "$status" -eq 2 ]; then exit 1; fi
            fi
            sleep 5
          done
          echo 'FAIL certification Pages deployment did not reach success'
          exit 1

      - name: Verify published COMPLETE audit and representative routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://salman0butt.github.io/handbook'

          check_page() {
            local path="$1"
            local needle="$2"
            local body=''
            for attempt in $(seq 1 24); do
              body=$(curl -fsSL --connect-timeout 10 --max-time 30 "$BASE$path" || true)
              if grep -Fq "$needle" <<< "$body"; then
                echo "PASS $path -> $needle"
                return 0
              fi
              sleep 5
            done
            echo "FAIL $path missing: $needle"
            return 1
          }

          check_page '/docs/ai-engineering/reference/final-completeness-audit' 'Status: COMPLETE'
          check_page '/docs/ai-engineering/reference/final-completeness-audit' '107 focused lessons'
          check_page '/docs/ai-engineering/zero-to-hero/mcp/mcp-server-discovery' 'server/discover'
          check_page '/docs/ai-engineering/zero-to-hero/inference/vllm-serving' 'vLLM Serving Architecture'
          check_page '/docs/ai-engineering/zero-to-hero/openai-agents-sdk/openai-agents-sdk-overview' 'OpenAI Agents SDK'
          check_page '/docs/ai-engineering/zero-to-hero/a2a/mcp-vs-a2a' 'MCP vs A2A'

          echo 'PASS final published zero-to-hero certification'
