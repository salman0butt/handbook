name: Validate handbook build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Build handbook
        id: build
        shell: bash
        run: |
          set +e
          npm run build > docusaurus-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Docusaurus build failed. Last 120 lines:"
            tail -120 docusaurus-build.log
          else
            echo "Docusaurus production build succeeded."
          fi
          exit "$status"

      - name: Verify React Native search artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "Search/index-like build files containing React Native terms:"
          matches=$(grep -RIl -E 'TurboModules|Hermes|Codegen|CocoaPods|Gradle' build 2>/dev/null | grep -Ei 'search|index' || true)
          printf '%s\n' "$matches" | head -30
          test -n "$matches"

      - name: Verify deployed React Native handbook
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://salman0butt.github.io/handbook'

          check_page() {
            local path="$1"
            local needle="$2"
            local body=''
            for attempt in $(seq 1 30); do
              body=$(curl -fsSL --connect-timeout 10 --max-time 30 "$BASE$path" || true)
              if printf '%s' "$body" | grep -Fq "$needle"; then
                echo "PASS $path -> $needle"
                return 0
              fi
              echo "Attempt $attempt: $path not ready yet"
              sleep 5
            done
            echo "FAIL $path missing expected content: $needle"
            return 1
          }

          check_page '/react-native' 'React Native'
          check_page '/docs/react-native/intro' 'React Native + Community CLI Developer Handbook'
          check_page '/docs/react-native/chapters/chapters-001-020' 'Community CLI'
          check_page '/docs/react-native/chapters/chapters-141-160' 'TurboModules'
          check_page '/docs/react-native/projects/projects-11-15' 'Native Module Application'
          check_page '/docs/react-native/projects/capstone-production-mobile-saas' 'Production Mobile SaaS'
          check_page '/docs/react-native/exercises/exercises-beginner-001-060' 'Beginner Exercises 001'
          check_page '/docs/react-native/interview-question-bank/interview-questions-staff-321-400' 'Staff Interview Questions 321'
          check_page '/docs/react-native/reference/final-completeness-audit' 'Status: NOT COMPLETE'

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docusaurus-build-log
          path: docusaurus-build.log
          if-no-files-found: warn
