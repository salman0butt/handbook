name: Validate handbook build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify topic curriculum
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Build handbook
        run: npm run build

      - name: Verify topic-by-topic sidebar
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const sidebars = require('./sidebars.ai-engineering.js');
          const items = sidebars.aiEngineeringSidebar;
          const labels = [];
          const ids = [];
          function walk(nodes) {
            for (const item of nodes || []) {
              if (!item || typeof item !== 'object') continue;
              if (typeof item.label === 'string') labels.push(item.label);
              if (item.type === 'doc') ids.push(item.id);
              if (Array.isArray(item.items)) walk(item.items);
            }
          }
          walk(items);
          const numbered = labels.filter(label => /\d/.test(label));
          if (numbered.length) throw new Error(`numeric sidebar labels: ${numbered.join(', ')}`);
          const topicIds = ids.filter(id => id.startsWith('ai-engineering/topics/'));
          if (topicIds.length !== 309) throw new Error(`expected 309 topic leaves, got ${topicIds.length}`);
          if (new Set(topicIds).size !== topicIds.length) throw new Error('duplicate topic doc ids detected');
          const legacy = ids.filter(id => id.includes('/chapters/chapters-'));
          if (legacy.length) throw new Error(`legacy bundled chapters still in sidebar: ${legacy.join(', ')}`);
          console.log(`PASS ${topicIds.length} focused topic leaves; ${labels.length} visible labels contain no digits`);
          NODE

      - name: Verify production search index coverage
        shell: bash
        run: |
          set -euo pipefail
          INDEX='build/search-index-docs-default-current.json'
          test -f "$INDEX"
          for term in \
            'neural networks' \
            'causal masking' \
            'few-shot prompting' \
            'prompt injection' \
            'Diffusion Transformers' \
            'flow matching' \
            'LoRA' \
            'Responses API' \
            'strict schema' \
            'HNSW' \
            'hybrid search' \
            'GraphRAG' \
            'agentic RAG' \
            'createAgent' \
            'StateSchema' \
            'interrupt' \
            'server/discover' \
            'subscriptions/listen' \
            'MCP Apps' \
            'Skills over MCP' \
            'Enterprise-Managed Authorization' \
            'trajectory evals' \
            'OpenTelemetry' \
            'SSRF' \
            'confused deputy' \
            'cost per successful task'; do
            grep -Fiq "$term" "$INDEX" || { echo "FAIL search index missing: $term"; exit 1; }
          done
          echo 'PASS representative beginner-to-staff topics are indexed'

      - name: Verify merged Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          MERGE_SHA=$(curl -fsSL 'https://api.github.com/repos/salman0butt/handbook/pulls/112' | python -c 'import json,sys; print(json.load(sys.stdin)["merge_commit_sha"])')
          test -n "$MERGE_SHA" && test "$MERGE_SHA" != 'None'
          API="https://api.github.com/repos/salman0butt/handbook/actions/runs?head_sha=$MERGE_SHA"
          for attempt in $(seq 1 36); do
            curl -fsSL -H 'Accept: application/vnd.github+json' "$API" -o /tmp/runs.json
            if python - <<'PY'
          import json
          with open('/tmp/runs.json', encoding='utf-8') as f:
              data = json.load(f)
          runs = [r for r in data.get('workflow_runs', []) if r.get('event') == 'push' and r.get('name') == 'Deploy handbook to GitHub Pages']
          ok = [r for r in runs if r.get('conclusion') == 'success']
          if ok:
              print('PASS Pages deployment', ok[0]['id'])
              raise SystemExit(0)
          print('Pages state:', [(r.get('id'), r.get('status'), r.get('conclusion')) for r in runs])
          raise SystemExit(1)
          PY
            then exit 0; fi
            sleep 5
          done
          echo 'FAIL Pages deployment did not succeed in time'
          exit 1

      - name: Verify deployed topic routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://salman0butt.github.io/handbook'
          check_page() {
            local path="$1" needle="$2" body=''
            for attempt in $(seq 1 20); do
              body=$(curl -fsSL --connect-timeout 10 --max-time 30 "$BASE$path" || true)
              if grep -Fq "$needle" <<< "$body"; then
                echo "PASS $path -> $needle"
                return 0
              fi
              sleep 5
            done
            echo "FAIL $path missing: $needle"
            return 1
          }
          check_page '/docs/ai-engineering/topics/start-here/learning-path' 'Complete Learning Path'
          check_page '/docs/ai-engineering/topics/foundations/attention' 'Attention'
          check_page '/docs/ai-engineering/topics/generative-ai/diffusion-transformers' 'Diffusion Transformers'
          check_page '/docs/ai-engineering/topics/prompt-engineering/few-shot-prompting' 'Few-Shot Prompting'
          check_page '/docs/ai-engineering/topics/model-apis/responses-api' 'Responses API'
          check_page '/docs/ai-engineering/topics/structured-tools/tool-calling' 'Tool Calling Fundamentals'
          check_page '/docs/ai-engineering/topics/embeddings/hnsw' 'HNSW Indexes'
          check_page '/docs/ai-engineering/topics/rag/graph-rag' 'GraphRAG'
          check_page '/docs/ai-engineering/topics/langchain/create-agent' 'createAgent'
          check_page '/docs/ai-engineering/topics/langgraph/interrupts' 'Interrupts for Human-in-the-Loop'
          check_page '/docs/ai-engineering/topics/agents/planner-executor' 'Planner-Executor Architecture'
          check_page '/docs/ai-engineering/topics/mcp/overview' 'MCP Fundamentals'
          check_page '/docs/ai-engineering/topics/mcp/server-discovery' 'server/discover'
          check_page '/docs/ai-engineering/topics/mcp/tasks' 'MCP Tasks Extension'
          check_page '/docs/ai-engineering/topics/evals-security/prompt-injection-security' 'Prompt Injection Security Architecture'
          check_page '/docs/ai-engineering/topics/production/system-design-method' 'AI System Design Method'
          check_page '/docs/ai-engineering/reference/topic-by-topic-curriculum-audit' 'Total core topic pages'
          check_page '/docs/ai-engineering/reference/final-completeness-audit' 'Status: REVALIDATION REQUIRED'
