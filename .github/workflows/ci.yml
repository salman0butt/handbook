name: Validate handbook build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify final topic curriculum release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify certification Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          MERGE_SHA=$(curl -fsSL 'https://api.github.com/repos/salman0butt/handbook/pulls/114' | python -c 'import json,sys; print(json.load(sys.stdin)["merge_commit_sha"])')
          test -n "$MERGE_SHA" && test "$MERGE_SHA" != 'None'
          API="https://api.github.com/repos/salman0butt/handbook/actions/runs?head_sha=$MERGE_SHA"
          for attempt in $(seq 1 40); do
            curl -fsSL -H 'Accept: application/vnd.github+json' "$API" -o /tmp/runs.json
            if python - <<'PY'
          import json
          with open('/tmp/runs.json', encoding='utf-8') as f:
              data = json.load(f)
          runs = [r for r in data.get('workflow_runs', []) if r.get('event') == 'push' and r.get('name') == 'Deploy handbook to GitHub Pages']
          ok = [r for r in runs if r.get('conclusion') == 'success']
          if ok:
              print('PASS final Pages deployment', ok[0]['id'])
              raise SystemExit(0)
          print('Pages state:', [(r.get('id'), r.get('status'), r.get('conclusion')) for r in runs])
          raise SystemExit(1)
          PY
            then exit 0; fi
            sleep 5
          done
          echo 'FAIL final Pages deployment did not succeed in time'
          exit 1

      - name: Verify published certification and representative topics
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://salman0butt.github.io/handbook'
          check_page() {
            local path="$1" needle="$2" body=''
            for attempt in $(seq 1 24); do
              body=$(curl -fsSL --connect-timeout 10 --max-time 30 "$BASE$path" || true)
              if grep -Fq "$needle" <<< "$body"; then
                echo "PASS $path -> $needle"
                return 0
              fi
              sleep 5
            done
            echo "FAIL $path missing: $needle"
            return 1
          }
          check_page '/docs/ai-engineering/reference/final-completeness-audit' 'Status: COMPLETE'
          check_page '/docs/ai-engineering/reference/final-completeness-audit' '309 focused core topic pages'
          check_page '/docs/ai-engineering/reference/topic-by-topic-curriculum-audit' 'Total core topic pages'
          check_page '/docs/ai-engineering/topics/prompt-engineering/zero-shot-prompting' 'Zero-Shot Prompting'
          check_page '/docs/ai-engineering/topics/prompt-engineering/few-shot-prompting' 'Few-Shot Prompting'
          check_page '/docs/ai-engineering/topics/mcp/overview' '2026-07-28'
          check_page '/docs/ai-engineering/topics/mcp/server-discovery' 'server/discover'
          check_page '/docs/ai-engineering/topics/production/staff-engineering' 'Staff-Level AI Engineering'
