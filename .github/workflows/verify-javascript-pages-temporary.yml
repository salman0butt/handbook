name: Verify merged JavaScript Pages deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: ${{ github.event.pull_request.head.ref == 'verify-javascript-pages-2026-08-02' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect exact merge deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const targetSha = '45a7318a9f817778dd4ed56a5a8cbeb61cd7a47c'
            const workflowName = 'Deploy handbook to GitHub Pages'
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: targetSha,
              event: 'push',
              per_page: 100,
            })
            const selected = response.data.workflow_runs.find(run => run.name === workflowName)
            if (!selected) throw new Error(`No ${workflowName} run found for ${targetSha}`)
            if (selected.status !== 'completed' || selected.conclusion !== 'success') {
              throw new Error(`Deployment is ${selected.status}/${selected.conclusion}`)
            }

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: selected.id,
              per_page: 100,
            })
            const summary = {
              targetSha,
              runId: selected.id,
              runNumber: selected.run_number,
              runAttempt: selected.run_attempt,
              runUrl: selected.html_url,
              event: selected.event,
              status: selected.status,
              conclusion: selected.conclusion,
              createdAt: selected.created_at,
              updatedAt: selected.updated_at,
              jobs: jobs.data.jobs.map(job => ({
                name: job.name,
                status: job.status,
                conclusion: job.conclusion,
                url: job.html_url,
                steps: job.steps?.map(step => ({name: step.name, conclusion: step.conclusion})) ?? [],
              })),
            }
            fs.writeFileSync('/tmp/deployment-summary.json', JSON.stringify(summary, null, 2))
            core.setOutput('run-url', selected.html_url)
            core.info(JSON.stringify(summary, null, 2))

      - name: Smoke-test published JavaScript routes
        shell: bash
        run: |
          set -uo pipefail
          base='https://salman0butt.github.io/handbook'
          sitemap="$base/sitemap.xml"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          failures=0

          routes=(
            '/docs/javascript/intro|JavaScript Developer Handbook'
            '/docs/javascript/version|ECMAScript 2026'
            '/docs/javascript/roadmap|JavaScript Learning Roadmap'
            '/docs/javascript/fundamentals/variables-and-values|Variables and Values'
            '/docs/javascript/types/type-system|JavaScript Type System'
            '/docs/javascript/functions/functions|Functions'
            '/docs/javascript/scope/scope-and-closures|Scope and Closures'
            '/docs/javascript/objects/objects|Objects'
            '/docs/javascript/prototypes/prototypes-and-inheritance|Prototypes and Inheritance'
            '/docs/javascript/async/promises-and-async-await|Promises and Async/Await'
            '/docs/javascript/event-loop/event-loop|JavaScript Event Loop'
            '/docs/javascript/modules/es-modules|ES Modules and Package Management'
            '/docs/javascript/dom/dom-fundamentals|DOM Fundamentals'
            '/docs/javascript/testing/testing-javascript|Testing JavaScript'
            '/docs/javascript/performance/performance-overview|JavaScript Performance'
            '/docs/javascript/security/javascript-security|JavaScript Security'
            '/docs/javascript/internals/execution-context|Execution Contexts and Environments'
            '/docs/javascript/projects/javascript-projects|JavaScript Projects'
          )

          sitemap_code=$(curl -sS -L --retry 5 --retry-delay 5 -o "$workdir/sitemap.xml" -w '%{http_code}' "$sitemap")
          test "$sitemap_code" = '200' || { echo "Sitemap HTTP $sitemap_code"; exit 1; }

          echo 'DEPLOYMENT_SUMMARY'
          cat /tmp/deployment-summary.json
          echo 'ROUTE_SMOKE_SUMMARY'
          printf '[\n'
          first=true

          for entry in "${routes[@]}"; do
            path=${entry%%|*}
            marker=${entry#*|}
            url="$base$path"
            file="$workdir/$(echo "$path" | tr '/' '_').html"
            code=$(curl -sS -L --retry 5 --retry-delay 5 -o "$file" -w '%{http_code}' "$url")

            http_ok=false; content_ok=false; not_404=false; sidebar_ok=false; sitemap_ok=false; canonical_ok=false
            test "$code" = '200' && http_ok=true
            grep -Fq "$marker" "$file" && content_ok=true
            ! grep -Eqi 'Page Not Found|404[^0-9].*Docusaurus' "$file" && not_404=true
            if grep -Eq 'theme-doc-sidebar|menu__list-item|Start Here' "$file"; then sidebar_ok=true; fi
            if grep -Fq "$url" "$workdir/sitemap.xml" || grep -Fq "$url/" "$workdir/sitemap.xml"; then sitemap_ok=true; fi
            canonical=$(grep -oE '<link[^>]+rel="canonical"[^>]+href="[^"]+"|<link[^>]+href="[^"]+"[^>]+rel="canonical"' "$file" | head -1 | grep -oE 'href="[^"]+"' | sed 's/^href="//;s/"$//' || true)
            if test "$canonical" = "$url" || test "$canonical" = "$url/"; then canonical_ok=true; fi

            if ! $http_ok || ! $content_ok || ! $not_404 || ! $sidebar_ok || ! $sitemap_ok || ! $canonical_ok; then
              failures=$((failures + 1))
              echo "DIAGNOSTIC path=$path http=$code marker=$content_ok not404=$not_404 sidebar=$sidebar_ok sitemap=$sitemap_ok canonical=$canonical" >&2
              grep -oE '<title>[^<]+' "$file" | head -1 >&2 || true
            fi

            if $first; then first=false; else printf ',\n'; fi
            printf '  {"path":"%s","http":%s,"content":%s,"not404":%s,"sidebar":%s,"sitemap":%s,"canonical":"%s","canonicalOk":%s}' \
              "$path" "$code" "$content_ok" "$not_404" "$sidebar_ok" "$sitemap_ok" "$canonical" "$canonical_ok"
          done
          printf '\n]\n'

          legacy="$workdir/legacy.html"
          legacy_code=$(curl -sS -L --retry 5 --retry-delay 5 -o "$legacy" -w '%{http_code}' "$base/javascript")
          legacy_content=false
          grep -Fq 'JavaScript' "$legacy" && legacy_content=true
          echo 'LEGACY_ROUTE_SUMMARY'
          printf '{"path":"/javascript","http":%s,"content":%s}\n' "$legacy_code" "$legacy_content"
          if test "$legacy_code" != '200' || ! $legacy_content; then failures=$((failures + 1)); fi

          if test "$failures" -ne 0; then
            echo "$failures route checks failed" >&2
            exit 1
          fi

      - name: Verification links
        run: |
          echo "Deployment run: ${{ steps.deployment.outputs.run-url }}"
          echo "Published handbook: https://salman0butt.github.io/handbook/docs/javascript/intro"
