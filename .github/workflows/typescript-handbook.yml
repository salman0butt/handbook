name: Validate TypeScript handbook

on:
  pull_request:
    paths:
      - 'docs/typescript/**'
      - 'src/components/TypeScriptLesson/**'
      - 'sidebars.typescript.js'
      - 'sidebars.final.js'
      - 'scripts/validate-typescript-handbook.mjs'
      - 'scripts/typescript-curriculum-manifest.js'
      - 'scripts/typescript-curriculum/**'
      - 'package.json'
      - '.github/workflows/typescript-handbook.yml'
  push:
    branches: [main]
    paths:
      - 'docs/typescript/**'
      - 'src/components/TypeScriptLesson/**'
      - 'sidebars.typescript.js'
      - 'sidebars.final.js'
      - 'scripts/validate-typescript-handbook.mjs'
      - 'scripts/typescript-curriculum-manifest.js'
      - 'scripts/typescript-curriculum/**'
      - 'package.json'
      - '.github/workflows/typescript-handbook.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run validate:typescript
      - run: npm run validate:mermaid
      - run: npm run build
      - name: Dispatch protected main Pages deployment
        if: github.event_name == 'pull_request' && github.head_ref == 'typescript-pages-final-deploy-2026-08-02'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
