name: Remove AI chapter heading numbers

on:
  push:
    branches:
      - ai-headings-remove-numbers-20260731

permissions:
  contents: write

jobs:
  rewrite:
    if: ${{ !contains(github.event.head_commit.message, '[heading-rewrite]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ai-headings-remove-numbers-20260731
          fetch-depth: 0

      - name: Remove numeric prefixes from AI chapter headings
        shell: python
        run: |
          from pathlib import Path
          import re

          chapter_dir = Path('docs/ai-engineering/chapters')
          heading = re.compile(r'^(#{1,6}\s+)\d{1,3}(?:\s*[–—-]\s*\d{1,3})?\s*[—–-]\s*(.+)$')
          title = re.compile(r'^(title:\s*)\d{1,3}(?:\s*[–—-]\s*\d{1,3})?\s*[—–-]\s*(.+)$')

          changed = []
          for path in sorted(chapter_dir.glob('*.md')):
              original = path.read_text(encoding='utf-8')
              lines = []
              for line in original.splitlines(keepends=True):
                  ending = '\n' if line.endswith('\n') else ''
                  body = line[:-1] if ending else line
                  body = heading.sub(r'\1\2', body)
                  body = title.sub(r'\1\2', body)
                  lines.append(body + ending)
              updated = ''.join(lines)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} chapter files')
          for path in changed:
              print(path)

      - name: Verify chapter headings have no numeric prefixes
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn '^#{1,6}[[:space:]]+[0-9]{1,3}([[:space:]]*[—–-][[:space:]]*[0-9]{1,3})?[[:space:]]*[—–-][[:space:]]+' docs/ai-engineering/chapters/*.md; then
            echo 'Numeric chapter heading prefixes remain'
            exit 1
          fi
          if grep -REn '^title:[[:space:]]+[0-9]{1,3}([[:space:]]*[—–-][[:space:]]*[0-9]{1,3})?[[:space:]]*[—–-][[:space:]]+' docs/ai-engineering/chapters/*.md; then
            echo 'Numeric chapter title prefixes remain'
            exit 1
          fi

      - name: Commit rewritten headings
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No heading changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ai-engineering/chapters
          git commit -m 'docs(ai): remove numeric prefixes from chapter headings [heading-rewrite]'
          git push origin HEAD:ai-headings-remove-numbers-20260731
