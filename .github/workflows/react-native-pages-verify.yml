name: Map React Native canonical Pages routes

on:
  pull_request:
    paths:
      - '.github/workflows/react-native-pages-verify.yml'

permissions:
  actions: read
  contents: read

jobs:
  map-routes:
    name: Inspect exact deployment sitemap
    runs-on: ubuntu-latest
    env:
      MERGE_SHA: e2a844dd02ee0e44cfcfd337219a2aa5b6f6134b
      BASE_URL: https://salman0butt.github.io/handbook
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Verify exact merge deployment
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          expected = os.environ['MERGE_SHA']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=20'
          request = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'react-native-pages-route-map',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          run = next((item for item in payload['workflow_runs'] if item['head_sha'] == expected), None)
          if not run or run['status'] != 'completed' or run['conclusion'] != 'success':
              raise SystemExit('Exact merge deployment is not successful')
          print(f"Exact Pages run: {run['html_url']}")
          PY

      - name: Print representative canonical sitemap entries
        run: |
          set -euo pipefail
          curl -fsSL "${BASE_URL}/sitemap.xml" -o /tmp/sitemap.xml
          grep -o 'https://[^<]*docs/react-native/[^<]*' /tmp/sitemap.xml \
            | grep -E '/(native-modules|architecture|testing|performance|security|deployment|projects|build)(/|$)' \
            | sort
