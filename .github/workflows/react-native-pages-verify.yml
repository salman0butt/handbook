name: Diagnose React Native native-modules route

on:
  pull_request:
    paths:
      - '.github/workflows/react-native-pages-verify.yml'

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    name: Inspect exact deployment routes
    runs-on: ubuntu-latest
    env:
      MERGE_SHA: e2a844dd02ee0e44cfcfd337219a2aa5b6f6134b
      BASE_URL: https://salman0butt.github.io/handbook
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Verify exact merge deployment
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          expected = os.environ['MERGE_SHA']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=20'
          request = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'react-native-pages-route-diagnostic',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          run = next((item for item in payload['workflow_runs'] if item['head_sha'] == expected), None)
          if not run or run['status'] != 'completed' or run['conclusion'] != 'success':
              raise SystemExit('Exact merge deployment is not successful')
          print(f"Exact Pages run: {run['html_url']}")
          PY

      - name: Inspect sitemap and route candidates
        run: |
          set -euo pipefail
          curl -fsSL "${BASE_URL}/sitemap.xml" -o /tmp/sitemap.xml
          echo 'Sitemap entries containing native-modules:'
          grep -o 'https://[^<]*native-modules[^<]*' /tmp/sitemap.xml || true

          candidates=(
            '/docs/react-native/native-modules/native-modules'
            '/docs/react-native/native-modules'
            '/docs/react-native/native-modules/native-modules-and-native-components'
            '/docs/react-native/native-modules/native-modules-and-components'
            '/docs/react-native/native-modules/native-modules-native-components'
          )

          for path in "${candidates[@]}"; do
            file="/tmp/$(echo "$path" | tr '/' '_').html"
            code="$(curl -L -sS -o "$file" -w '%{http_code}' "${BASE_URL}${path}")"
            title="$(grep -o '<title>[^<]*' "$file" | head -1 || true)"
            echo "$code ${BASE_URL}${path} ${title}"
          done
