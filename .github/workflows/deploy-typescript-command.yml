name: Deploy completed TypeScript handbook

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.issue.number == 132 &&
      github.event.comment.body == '/deploy-completed-typescript-handbook' &&
      github.event.comment.user.login == 'salman0butt'
    name: Build completed handbook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript handbook
        run: npm run validate:typescript

      - name: Validate Mermaid diagrams
        run: npm run validate:mermaid

      - name: Build handbook
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    if: >-
      github.event.issue.number == 132 &&
      github.event.comment.body == '/deploy-completed-typescript-handbook' &&
      github.event.comment.user.login == 'salman0butt'
    name: Deploy completed handbook
    needs: build
    permissions:
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/131/comments" \
            -f body="GitHub Pages production deployment succeeded from main: ${DEPLOYED_URL}"
