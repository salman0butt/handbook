name: Verify Node.js Pages

on:
  pull_request:
    paths:
      - '.github/workflows/nodejs-pages-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke published Node.js handbook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify published routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://salman0butt.github.io/handbook'
          routes=(
            '/nodejs'
            '/docs/nodejs/intro'
            '/docs/nodejs/foundations'
            '/docs/nodejs/event-loop'
            '/docs/nodejs/async-io-libuv'
            '/docs/nodejs/streams'
            '/docs/nodejs/http-fundamentals'
            '/docs/nodejs/tcp-udp-networking'
            '/docs/nodejs/worker-threads'
            '/docs/nodejs/memory-management'
            '/docs/nodejs/security'
            '/docs/nodejs/node-test-runner'
            '/docs/nodejs/typescript-with-node'
            '/docs/nodejs/diagnostics'
            '/docs/nodejs/performance'
            '/docs/nodejs/observability'
            '/docs/nodejs/distributed-systems'
            '/docs/nodejs/production-operations'
            '/docs/nodejs/staff-level-architecture'
            '/docs/nodejs/projects/production-rest-api'
            '/docs/nodejs/interview-mastery/overview'
            '/docs/nodejs/interview-question-bank/overview'
            '/docs/nodejs/mock-interview-practice/overview'
            '/docs/nodejs/reference/api-coverage'
            '/docs/nodejs/reference/final-completeness-audit'
          )

          for route in "${routes[@]}"; do
            url="${base}${route}"
            echo "Checking ${url}"
            curl --fail --silent --show-error --location \
              --retry 40 --retry-delay 5 --retry-all-errors \
              --max-time 20 "$url" -o page.html
            grep -qi '<!doctype html' page.html
          done

          echo "Verified ${#routes[@]} published Node.js handbook routes."
